services:
  minio:
    image: minio/minio:RELEASE.2026-01-18T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpass123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    environment:
      QUARKUS_HTTP_PORT: "19120"
    ports:
      - "19120:19120"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio:
